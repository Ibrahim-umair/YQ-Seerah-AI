services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seerah_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the .env's host-side defaults - inside the compose network,
      # containers reach each other by service name, not localhost.
      - POSTGRES_HOST=postgres
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - postgres
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: seerah_qdrant
    ports:
      - "6333:6333"  # REST API + dashboard (http://localhost:6333/dashboard)
      - "6334:6334"  # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: seerah_postgres
    environment:
      POSTGRES_DB: seerah
      POSTGRES_USER: seerah
      POSTGRES_PASSWORD: seerah
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_storage:/var/lib/postgresql/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: seerah_grafana
    # Private ops dashboard only - deliberately never exposed publicly, see README.
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  grafana_data:
