<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seerah AI</title>

    <!-- Open Graph / link-preview tags - what WhatsApp, Slack, Discord, iMessage, etc.
         read to build a rich preview card instead of showing a bare link. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Seerah AI" />
    <meta property="og:description" content="Ask questions about the life of the Prophet Muhammad and get answers grounded in Dr. Yasir Qadhi's 104-lecture Seerah series, with citations to the exact lecture." />
    <meta property="og:url" content="https://seerah-ai.ibrahimumair900.workers.dev" />
    <meta property="og:image" content="https://seerah-ai.ibrahimumair900.workers.dev/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X reads its own tag set separately from Open Graph. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seerah AI" />
    <meta name="twitter:description" content="Ask questions about the life of the Prophet Muhammad and get answers grounded in Dr. Yasir Qadhi's 104-lecture Seerah series, with citations to the exact lecture." />
    <meta name="twitter:image" content="https://seerah-ai.ibrahimumair900.workers.dev/og-preview.png" />
